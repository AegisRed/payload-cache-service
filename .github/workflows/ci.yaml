name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest --cov=cache_service --cov-report=term-missing --cov-fail-under=90

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
          python-version: "3.11"
      - run: uv sync --locked
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - name: Verify CLI against the container
        run: |
          uv run --no-sync cache-cli --repeat 3 --input examples/payload.json --output results.jsonl
          uv run --no-sync python -c "import json; from pathlib import Path; rows = [json.loads(line) for line in Path('results.jsonl').read_text().splitlines()]; assert len(rows) == 3; assert [row['reused'] for row in rows] == [False, True, True]; assert len({row['id'] for row in rows}) == 1; assert rows[0]['output'] == 'FIRST STRING, OTHER STRING, SECOND STRING, ANOTHER STRING, THIRD STRING, LAST STRING'"
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
